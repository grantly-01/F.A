services:
  # ---- Backend API ----
  backend:
    build: ./backend
    container_name: funding-api
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-fundagg}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-fundagg_secret_password}
      - POSTGRES_DB=${POSTGRES_DB:-funding_aggregator}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-jwt-secret}
      - DEBUG=true
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - funding-net

  # ---- Frontend ----
  frontend:
    build: ./frontend
    container_name: funding-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - funding-net

  # ---- PostgreSQL ----
  db:
    image: postgres:15-alpine
    container_name: funding-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-fundagg}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-fundagg_secret_password}
      - POSTGRES_DB=${POSTGRES_DB:-funding_aggregator}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fundagg}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - funding-net

  # ---- Redis ----
  redis:
    image: redis:7-alpine
    container_name: funding-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - funding-net

  # ---- Prometheus ----
  prometheus:
    image: prom/prometheus:latest
    container_name: funding-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - funding-net

  # ---- Grafana ----
  grafana:
    image: grafana/grafana:latest
    container_name: funding-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - funding-net

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  funding-net:
    driver: bridge
